        {
            "name" : "post-fs-data",
            "cmds" : [
                "chown sensor_host system /dev/hf_manager",
                "chmod 0660 /dev/hf_manager",
                "mkdir /data/vendor 0771 root root",
                "mkdir /data/vendor/audiohal 0771 audio_host audio"
            ]
        },
        {
            "name" : "boot",
            "cmds" : [
                "start wmtwifi-on"
            ]
        },
        {
            "name" : "param:android.composer.ready=1",
            "condition" : "android.composer.ready=1",
            "cmds" : [
                "chown vibrator_host system /sys/class/leds/vibrator/duration",
                "chown vibrator_host system /sys/class/leds/vibrator/activate",
                "chmod 0220 /sys/class/leds/vibrator/duration",
                "chmod 0220 /sys/class/leds/vibrator/activate",
                "chown vibrator_host system /sys/class/leds/vibrator/state",
                "chmod 0660 /sys/class/leds/vibrator/state"
            ]
        }
    ],
    "services" : [
        {
            "name" : "wmtwifi-on",
            "path" : [ "/system/bin/wmtdetect-init", "wifi-on" ],
            "uid" : "root",
            "gid" : [ "root" ],
            "once" : 1
        }
    ]
