{
    "jobs" : [
        {
            "name" : "pre-init",
            "cmds" : [
                "mkdir /dev/binderfs 0755 root root",
                "mount binder binder /dev/binderfs noexec,nosuid",
                "symlink /dev/binderfs/android-binder /dev/binder",
                "symlink /dev/binderfs/hwbinder  /dev/hwbinder",
                "symlink /dev/binderfs/vndbinder /dev/vndbinder",
                "chmod 0666 /dev/binderfs/binder",
                "chmod 0666 /dev/binderfs/hwbinder",
                "chmod 0666 /dev/binderfs/vndbinder",
                "mkdir /dev/__properties__ 0755 root root",
                "mount tmpfs tmpfs /dev/__properties__ noexec,nosuid,nodev mode=0755",
                "mkdir /dev/pts 0755 root root",
                "mount devpts devpts /dev/pts noexec,nosuid mode=0620,gid=5",
                "write /sys/module/firmware_class/parameters/path /android/vendor/firmware",
                "setparam ohos.audio.hdi_impl vdi",
                "setparam ohos.camera.hdi_impl vdi",
                "setparam const.cust.config_dir_layer /system:/chipset:/sys_prod:/chip_prod:/sys_prod/devices/ansuz"
            ]
        },
        {
            "name" : "post-fs-data",
            "cmds" : [
                "start wmtwifi-on",
                "chown sensor_host system /dev/hf_manager",
                "chmod 0660 /dev/hf_manager",
                "chown vibrator_host system /sys/class/leds/vibrator/duration",
                "chown vibrator_host system /sys/class/leds/vibrator/activate",
                "chmod 0220 /sys/class/leds/vibrator/duration",
                "chmod 0220 /sys/class/leds/vibrator/activate",
                "mkdir /data/vendor 0771 root root",
                "mkdir /data/vendor/audiohal 0771 audio_host audio"
            ]
        },
        {
            "name" : "param:bootevent.boot.completed=true",
            "condition" : "bootevent.boot.completed=true",
            "cmds" : [
                "write /proc/gpufreqv2/fix_target_opp_index 16"
            ]
        }
    ],
    "services" : [
        {
            "name" : "wmtwifi-on",
            "path" : [ "/system/bin/wmtdetect-init", "wifi-on" ],
            "uid" : "root",
            "gid" : [ "root" ],
            "once" : 1
        }
    ]
}
